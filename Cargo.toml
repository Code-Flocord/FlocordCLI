[package]
name = "FlocordCLI"
version = "2.9.6"
edition = "2024"


[[bin]]
name = "FlocordCLI"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
ed25519-dalek = "3.0.0"
reqwest = { version = "0.12", features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
